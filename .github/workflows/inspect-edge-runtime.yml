name: Inspect edge runtime

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Inspect Supabase runtime layout
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"
            printf "\nRelevant mounts:\n"
            docker inspect $(docker ps -q) --format "{{.Name}} {{range .Mounts}}{{.Source}} -> {{.Destination}}; {{end}}" | grep -Ei "supabase|edge|function" || true
          '
